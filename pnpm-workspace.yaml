# pnpm blocks dependency install scripts by default. These two are native
# packages that fetch or compile a platform binary. Neither is needed at
# runtime here, so their scripts stay blocked:
#   sharp         — libvips image binary, pulled in by next.
#   unrs-resolver — native resolver behind eslint-import-resolver-typescript.
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# Force patched in-major versions of dev/build-time transitive deps to clear
# pnpm audit CVEs (eslint toolchain, gray-matter's js-yaml, @tailwindcss/postcss's
# postcss). All same-major bumps, no API breaks.
#
# These MUST live here, not in package.json under "pnpm.overrides". pnpm 11
# stopped reading that field and ignores it silently — the failure mode is an
# audit that looks clean while every pin is dead. pnpm 10 reads this file too,
# so this location is the correct one on both versions.
#
# This repo has no `packageManager` pin, so it follows whatever pnpm is on PATH
# (10.15.0 as of 2026-09-01). That is exactly why the pins cannot sit in
# package.json: a future bump to pnpm 11 would silently disarm them.
#
# Pins reviewed 2026-11-01.
overrides:
  # GHSA-g3hv-75wg-m249 (2026-10-30) lists every minimatch <11.0.1, but its bug
  # (**/.. globParts amplification in firstPhasePreProcess, optimizationLevel>=2)
  # does not exist in 3.x (checked: neither name appears in 3.1.5). 3.x cannot be
  # forced to 11 either: eslint 9 calls require("minimatch") as a function. So
  # minimatch@3 stays visible in the audit on purpose. Re-check each checkup for
  # a corrected advisory range or an eslint that drops minimatch 3.
  minimatch@3: 3.1.5
  # Same advisory, real here. Only typescript-estree uses 10.x, and only the
  # named minimatch() call, which 11 keeps. Dev-only (lint).
  minimatch@10: 11.0.3
  flatted: 3.4.2
  ajv@6: 6.15.0
  # GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7, GHSA-q2hr-2g5m-vwhr (all published
  # 2026-09-29) each list BOTH lines: 1.x needs >=1.1.21, 5.x needs >=5.0.12.
  brace-expansion@1: 1.1.21
  brace-expansion@5: 5.0.12
  # GHSA-5p4m-2wfm-xmqj (<3.15.1 / <4.3.1) and then GHSA-2883-xcg3-v3hh
  # (2026-09-08: <3.15.2 / <4.3.2) each cover BOTH lines. Pin each major to the
  # newest patched floor.
  js-yaml@3: 3.15.2
  js-yaml@4: 4.3.2
  '@babel/core': 7.29.7
  postcss@8: 8.5.25
  # postcss's own nanoid dep; GHSA-2v37-7h3g-55p8, patched in 3.3.18.
  nanoid@3: 3.3.18
  # Reaches browserslist via @babel/core's helper-compilation-targets.
  # GHSA-c83g-rgw3-j3cx + GHSA-73wf-gq98-2v4g, both published 2026-09-01,
  # both patched in 4.28.7; 4.28.8 is the current 4.28 patch. Build-time only.
  browserslist@4: 4.28.8
  # GHSA-w5vr-8v7q-w6rv (2026-08-13), patched in 2.11.0. Reaches us via next
  # (^2.9.19, so in range) and browserslist; the lockfile held 2.10.25 for next.
  baseline-browser-mapping@2: 2.11.27
  # GHSA-p498-v437-472g (2026-09-02), via eslint (declares ^0.16.6, so in range).
  '@humanfs/node': 0.16.8
  # GHSA-68fv-2mgg-jv7q (2026-09-18), patched in 1.2.2. Via @tailwindcss/node
  # (^1.2.1) and next. Build-time only.
  source-map-js: 1.2.2
  # GHSA-mrhx-c7xc-m3w5 (2026-10-01), patched in 4.6.6. Via
  # eslint-plugin-react-hooks (^3.25.0 || ^4.0.0). Dev-only.
  zod@4: 4.6.7
  # braces <=3.0.3 (GHSA-vfj7-8cjw-p6xm) and sprintf-js <=1.1.3 (GHSA-hp3w-g68c-fv3c)
  # were both WITHDRAWN by GitHub on 2026-10-22/23, so no pin is needed for either.
